name: Public tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Job names are required status checks in branch protection; keep them stable.
  read-only-agent-guard:
    name: read-only-agent-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run the full test suite
        run: node --test --test-concurrency=1

  codex-installer:
    name: Codex installer (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify Codex installer preflight and upgrade backup
        run: node tests/codex-installer.test.mjs
      - name: Verify external state persistence
        run: node tests/storage-persistence.test.mjs
