name: Public tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codex-installer:
    name: Codex installer (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Codex installer preflight and upgrade backup
        run: node tests/codex-installer.test.mjs
      - name: Verify external state persistence
        run: node tests/storage-persistence.test.mjs

  read-only-agent-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the read-only agent Bash guard
        run: node tests/security/investigator-bash-guard.test.mjs
      - name: Verify native prompt boundary nonce generation
        run: node tests/security/native-prompt-boundary.test.mjs
      - name: Verify pre-write validator policy and content boundaries
        run: node tests/security/pre-write-validator-policy.test.mjs
      - name: Verify active plugin runtime-root resolution
        run: node tests/runtime-root.test.mjs
      - name: Verify Claude and Codex package metadata
        run: node tests/plugin-package.test.mjs
      - name: Verify general review defaults and portable runtime contract
        run: node tests/review/general-review.test.mjs
